<!DOCTYPE html>
<html>
<head>
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="Expensive-Tracker.css">
</head>
<body>

    <div class="tracker">
                <p>Smart Expense Tracker Dashboard</p>
            </div>
                <div class="container">
                    <div class="Top-section">
                        <div class="top-bar">
                            <input type="text" id="title" placeholder="Enter Item">
                                <select id="category">
                                    <option value="">Select Category</option>
                                    <option value="Food">Food</option>
                                    <option value="Travel">Travel</option>
                                    <option value="Shopping">Shopping</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Education">Education</option>
                                </select>
                                <input type="number" id="amount" placeholder="Enter Amount">
                                <button onclick="addExpense()">Add Expense</button>
                            </div>
                        </div>
                        <div class="top">
                            <div class="Total-Expenses">
                                <h3>Total Expenses</h3>
                                <p id="totalExpense">₹0</p>
                            </div>
                            <div class="Highest-Expenses">
                                <h3>Highest Expense</h3>
                                <p id="highestExpense">₹0</p>
                            </div>
                            <div class="Total-Transactions">
                                <h3>Total Transactions</h3>
                                <p id="totalTransactions">0</p>
                            </div>
                        </div>
                        <div class="Filter-box">
                            <label>Filter by Category:</label>
                            <select id="filtercategories">
                            <option value="all">All Categories</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Education">Education</option>
                            </select>
                        </div>
                        <div class="Table">
                            <table>
                                <thead>
                                    <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Amount (₹)</th>
                                    <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                    </div>
                    <script>
                        let expenses = [];
                            fetch("Expensive-Tracker.json")
                            .then(function(response){
                                return response.json();
                            })
                            .then(function(data){
                                expenses = data.map(function(item){
                                    return {
                                        id: item.id,
                                        title: item.title,
                                        category: item.Category,
                                        amount: item["Amount(₹)"]
                                    };
                                });
                                displayExpenses(expenses);
                                updateSummary();
                            })
                            .catch(function(error){
                                    console.log("Error Loading JSON");
                                });
                                function displayExpenses(expenseList){
                                    let rows = "";
                                    expenseList.forEach(function(expense){
                                        rows += `
                                        <tr>
                                            <td>${expense.id}</td>
                                            <td>${expense.title}</td>
                                            <td>${expense.category}</td>
                                            <td>₹${expense.amount}</td>
                                            <td>
                                                <button class="delete-btn"
                                                onclick="deleteExpense(${expense.id})">Delete</button>
                                            </td>
                                        </tr>
                                    `;
                                });
                                document.getElementById("tableBody").innerHTML = rows;
                            }
                            function addExpense(){
                                let title =
                                document.getElementById("title").value;
                                let category =
                                document.getElementById("category").value;
                                let amount =
                                document.getElementById("amount").value;
                                if(title === "" || category === "" || amount === ""){
                                    alert("Please fill all fields");
                                    return;
                                }
                                let newExpense = {
                                    id: expenses.length + 1,
                                    title: title,
                                    category: category,
                                    amount: Number(amount)
                                };
                                expenses.push(newExpense);
                                displayExpenses(expenses);
                                updateSummary();
                                document.getElementById("title").value = "";
                                document.getElementById("category").value = "";
                                document.getElementById("amount").value = "";
                            }
                            function deleteExpense(id){
                                expenses = expenses.filter(function(expense){
                                    return expense.id !== id;
                                });
                                displayExpenses(expenses);
                                updateSummary();
                            }
                            function updateSummary(){
                                let total = expenses.reduce(function(sum, expense){
                                    return sum + expense.amount;
                                }, 0);
                                document.getElementById("totalExpense")
                                .innerText = "₹" + total;
                                let highest = 0;
                                expenses.forEach(function(expense){
                                    if(expense.amount > highest){
                                        highest = expense.amount; 
                                    }
                                });
                                document.getElementById("highestExpense")
                                .innerText = "₹" + highest;
                                document.getElementById("totalTransactions")
                                .innerText = expenses.length;
                            }
                            document.getElementById("filtercategories")
                            .addEventListener("change", filterExpenses);
                            function filterExpenses(){
                                let selectedCategory =
                                document.getElementById("filtercategories").value;
                                if(selectedCategory === "all"){
                                    displayExpenses(expenses);
                                }
                                else{
                                    let filteredExpenses =
                                    expenses.filter(function(expense){
                                        return expense.category.toLowerCase()=== selectedCategory.toLowerCase();
                                    });
                                    displayExpenses(filteredExpenses);
                                }
                            }
                    </script>
    </body>
</html>
